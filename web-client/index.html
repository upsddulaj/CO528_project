<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DECP Web Client</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>DECP Web Client (MVP)</h1>
      <p>Register/login, create posts, and browse feed against the same backend APIs used by mobile.</p>

      <section>
        <h2>Auth</h2>
        <form id="registerForm">
          <input id="name" placeholder="Name" required />
          <input id="email" placeholder="Email" type="email" required />
          <input id="password" placeholder="Password" type="password" required />
          <select id="role">
            <option value="student">student</option>
            <option value="alumni">alumni</option>
            <option value="admin">admin</option>
          </select>
          <button type="submit">Register</button>
        </form>
      </section>

      <section>
        <h2>Create Post</h2>
        <form id="postForm">
          <textarea id="content" rows="3" placeholder="Share an update"></textarea>
          <button type="submit">Publish</button>
        </form>
      </section>

      <section>
        <h2>Feed</h2>
        <button id="refreshFeed">Refresh Feed</button>
        <ul id="feedList"></ul>
      </section>

      <pre id="log"></pre>
    </main>
    <script src="app.js"></script>
  </body>
</html>
